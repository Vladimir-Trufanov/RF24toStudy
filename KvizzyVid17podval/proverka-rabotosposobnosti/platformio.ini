[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Для обеспечения вывода в com-порт в Esp32-C3 включаем опцию - USB CDC On Boot
; (это самая частая причина. В Arduino IDE по умолчанию Serial ссылается на аппаратный UART0 
; (пины GPIO21 TX и GPIO20 RX). Когда ваша плата подключена к USB напрямую (минуя микросхему USB-UART), 
; то вывод на эти пины просто не доходит. Для того, чтобы переключить Serial на встроенный USB-контроллер
; и вывод отправить в COM-порт в меню Arduino IDE нужно выбрать Tools → USB CDC On Boot → Enabled,
; а в platformio.ini добавить команду build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

lib_deps = 
  symlink://C:/RF24toStudy
;  symlink://C:/PlatformIO_Lib/Adafruit_Unified_Sensor
;  symlink://C:/PlatformIO_Lib/DHT_sensor_library
;  symlink://C:/PlatformIO_Lib/iarduino_VCC
;  symlink://C:/PlatformIO_Lib/GyverWDT
