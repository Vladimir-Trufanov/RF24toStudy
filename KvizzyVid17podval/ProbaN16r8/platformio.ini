; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Настраиваем на контроллер ESP32-S3 N16R8
[env:esp32s3usbotg]
platform = espressif32
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200

; Настраиваем PSRAM 8Mb:
; -DBOARD_HAS_PSRAM — флаг, сигнализирующий, что на плате есть PSRAM 
; -mfix-esp32-psram-cache-issue — специальный флаг для исправления проблем с кэшем PSRAM, 
;  которые иногда приводят к сбоям
; board_build.arduino.memory_type = qio_opi — задаёт режим работы памяти 
; (QIO для Flash + OPI для PSRAM) 
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
board_build.arduino.memory_type = qio_opi


